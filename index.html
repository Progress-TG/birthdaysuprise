<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>For You 💙</title>

    <!-- Google Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            background:
                radial-gradient(circle at 50% 45%, #10264a 0%, #071426 30%, #02060d 70%);
            color: white;
            font-family: "Inter", sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        /* Background stars */

        .stars {
            position: fixed;
            inset: 0;
            pointer-events: none;
        }

        .star {
            position: absolute;
            width: 2px;
            height: 2px;
            background: white;
            border-radius: 50%;
            opacity: 0.4;
            animation: twinkle 3s infinite ease-in-out;
        }

        @keyframes twinkle {
            0%, 100% {
                opacity: 0.15;
            }

            50% {
                opacity: 0.8;
            }
        }

        /* Main container */

        .container {
            text-align: center;
            width: 90%;
            max-width: 700px;
            position: relative;
            z-index: 2;
        }

        /* Small system text */

        .system {
            font-family: "Space Mono", monospace;
            font-size: 12px;
            letter-spacing: 3px;
            color: #6e9bd4;
            margin-bottom: 30px;
            opacity: 0;
            animation: fadeIn 1.5s forwards;
        }

        /* Main title */

        h1 {
            font-size: clamp(48px, 10vw, 90px);
            font-weight: 600;
            letter-spacing: -4px;
            margin-bottom: 15px;

            background: linear-gradient(
                90deg,
                #ffffff,
                #b8d5ff,
                #ffffff
            );

            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;

            opacity: 0;
            animation: titleAppear 2s 1s forwards;
        }

        /* Subtitle */

        .subtitle {
            font-family: "Space Mono", monospace;
            color: #8fa9cc;
            font-size: 14px;
            letter-spacing: 2px;
            margin-bottom: 55px;

            opacity: 0;
            animation: fadeIn 1.5s 2s forwards;
        }

        /* Enter button */

        .enter-button {
            position: relative;
            display: inline-block;
            padding: 16px 45px;

            border: 1px solid #426a9f;
            border-radius: 4px;

            color: white;
            background: rgba(16, 38, 74, 0.35);

            font-family: "Space Mono", monospace;
            font-size: 13px;
            letter-spacing: 3px;

            cursor: pointer;
            text-decoration: none;

            opacity: 0;
            animation:
                fadeIn 1.5s 3s forwards,
                pulse 3s 4s infinite;

            transition:
                background 0.3s ease,
                border-color 0.3s ease,
                transform 0.3s ease;
        }

        .enter-button:hover {
            background: rgba(44, 91, 151, 0.35);
            border-color: #8bb8f0;
            transform: translateY(-3px);
        }

        /* Tiny text underneath */
/* =========================
   BIRTHDAY COUNTDOWN
========================= */

.countdown-section {
    margin-top: 35px;
    margin-bottom: 40px;

    opacity: 0;

    animation: fadeIn 1.5s 2.5s forwards;
}

.countdown-label {
    font-family: "Space Mono", monospace;
    font-size: 9px;
    letter-spacing: 3px;

    color: #506684;

    margin-bottom: 15px;
}

.countdown {
    display: flex;
    justify-content: center;
    align-items: center;

    gap: 14px;
}

.time-unit {
    min-width: 55px;
}

.time-unit span {
    display: block;

    font-family: "Space Mono", monospace;
    font-size: 25px;
    font-weight: 400;

    color: #d8e7fa;

    text-shadow:
        0 0 15px rgba(139, 184, 240, 0.25);
}

.time-unit small {
    display: block;

    margin-top: 5px;

    font-family: "Space Mono", monospace;
    font-size: 8px;
    letter-spacing: 1px;

    color: #506684;
}

.separator {
    color: #426a9f;

    font-family: "Space Mono", monospace;
    font-size: 20px;

    margin-top: -13px;

    animation: countdownPulse 1s infinite;
}

@keyframes countdownPulse {

    0%, 100% {
        opacity: 0.3;
    }

    50% {
        opacity: 1;
    }

}

/* Mobile */

@media (max-width: 500px) {

    .countdown {
        gap: 7px;
    }
    .birthday-message {
    font-family: "Space Mono", monospace;
    font-size: 15px;
    letter-spacing: 3px;
    color: #d8e7fa;

    text-shadow:
        0 0 20px rgba(139, 184, 240, 0.5);

    animation: birthdayGlow 2s infinite alternate;
}

@keyframes birthdayGlow {

    from {
        opacity: 0.65;
    }

    to {
        opacity: 1;
    }

}

    .time-unit {
        min-width: 48px;
    }

    .time-unit span {
        font-size: 19px;
    }

    .time-unit small {
        font-size: 7px;
    }

    .separator {
        font-size: 16px;
    }

}
        .hint {
            margin-top: 22px;
            font-size: 11px;
            color: #506684;
            letter-spacing: 1px;

            opacity: 0;
            animation: fadeIn 1.5s 3.5s forwards;
        }

        /* Animations */

        @keyframes fadeIn {
            from {
                opacity: 0;
            }

            to {
                opacity: 1;
            }
        }

        @keyframes titleAppear {
            from {
                opacity: 0;
                transform: translateY(15px);
                filter: blur(8px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
                filter: blur(0);
            }
        }

        @keyframes pulse {
            0%, 100% {
                box-shadow: 0 0 0 rgba(83, 144, 220, 0);
            }

            50% {
                box-shadow:
                    0 0 25px rgba(83, 144, 220, 0.18);
            }
        }

    </style>
</head>

<body>

    <!-- Background stars -->
    <div class="stars">

        <span class="star" style="top:10%; left:15%;"></span>
        <span class="star" style="top:22%; left:72%; animation-delay:1s;"></span>
        <span class="star" style="top:67%; left:12%; animation-delay:2s;"></span>
        <span class="star" style="top:80%; left:82%; animation-delay:.5s;"></span>
        <span class="star" style="top:35%; left:90%; animation-delay:1.5s;"></span>
        <span class="star" style="top:74%; left:60%; animation-delay:2.5s;"></span>
        <span class="star" style="top:15%; left:45%; animation-delay:.8s;"></span>
        <span class="star" style="top:88%; left:30%; animation-delay:1.8s;"></span>

    </div>


    <!-- Main content -->

    <main class="container">

        <div class="system">
            SYSTEM INITIALIZED
        </div>

        <h1>
            For You.
        </h1>

        <p class="subtitle">
            A little something made just for you.
        </p>
<div class="countdown-section">

    <div class="countdown-label">
        COUNTDOWN TO YOUR 18TH
    </div>

    <div class="countdown" id="countdown">

        <div class="time-unit">
            <span id="days">00</span>
            <small>DAYS</small>
        </div>

        <div class="separator">:</div>

        <div class="time-unit">
            <span id="hours">00</span>
            <small>HOURS</small>
        </div>

        <div class="separator">:</div>

        <div class="time-unit">
            <span id="minutes">00</span>
            <small>MINUTES</small>
        </div>

        <div class="separator">:</div>

        <div class="time-unit">
            <span id="seconds">00</span>
            <small>SECONDS</small>
        </div>

    </div>

</div>
        <a href="main.html" class="enter-button">
            ENTER →
        </a>

        <p class="hint">
            ACCESS GRANTED • 09.11.2026
        </p>

    </main>

</body>
    <script>

    // Birthday: November 9, 2026
    const birthday = new Date("November 9, 2026 00:00:00").getTime();

    function updateCountdown() {

        const now = new Date().getTime();

        const difference = birthday - now;

        if (difference <= 0) {

            document.getElementById("countdown").innerHTML =
                "<div class='birthday-message'>HAPPY 18TH BIRTHDAY 💙</div>";

            return;
        }

        const days = Math.floor(
            difference / (1000 * 60 * 60 * 24)
        );

        const hours = Math.floor(
            (difference / (1000 * 60 * 60)) % 24
        );

        const minutes = Math.floor(
            (difference / (1000 * 60)) % 60
        );

        const seconds = Math.floor(
            (difference / 1000) % 60
        );

        document.getElementById("days").textContent =
            String(days).padStart(2, "0");

        document.getElementById("hours").textContent =
            String(hours).padStart(2, "0");

        document.getElementById("minutes").textContent =
            String(minutes).padStart(2, "0");

        document.getElementById("seconds").textContent =
            String(seconds).padStart(2, "0");
    }

    updateCountdown();

    setInterval(updateCountdown, 1000);

</script>

</body>
</html>
</html>
